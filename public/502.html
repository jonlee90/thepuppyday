<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Puppy Day - Be Right Back!</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta http-equiv="refresh" content="5">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F8EEE5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #434E54;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 480px;
    }
    .paw { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { color: #6B7B82; line-height: 1.6; }
    .spinner {
      margin: 1.5rem auto;
      width: 32px; height: 32px;
      border: 3px solid #E8D5C4;
      border-top-color: #434E54;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="paw">🐾</div>
    <h1>We'll be right back!</h1>
    <p>We're updating The Puppy Day to make it even better. This page will automatically refresh in a few seconds.</p>
    <div class="spinner"></div>
  </div>
</body>
</html>
