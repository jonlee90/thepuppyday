# The Puppy Day - Nginx Configuration
# Copy to /etc/nginx/sites-available/thepuppyday.com
# Then: ln -s /etc/nginx/sites-available/thepuppyday.com /etc/nginx/sites-enabled/
# Then: certbot --nginx -d thepuppyday.com -d www.thepuppyday.com

# Redirect www to non-www
server {
    listen 80;
    listen [::]:80;
    server_name www.thepuppyday.com;
    return 301 https://thepuppyday.com$request_uri;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name thepuppyday.com;
    return 301 https://thepuppyday.com$request_uri;
}

# HTTPS www redirect
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.thepuppyday.com;

    # SSL certs managed by Certbot
    ssl_certificate /etc/letsencrypt/live/thepuppyday.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thepuppyday.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://thepuppyday.com$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name thepuppyday.com;

    # SSL certs managed by Certbot
    ssl_certificate /etc/letsencrypt/live/thepuppyday.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thepuppyday.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Upload limit (for gallery images)
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Next.js static assets — serve from disk, bypass Node
    location /_next/static {
        alias /var/www/html/thepuppyday/.next/static;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Public static files — serve from disk
    location /images/ {
        alias /var/www/html/thepuppyday/public/images/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /favicon.ico {
        alias /var/www/html/thepuppyday/public/favicon.ico;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Service worker — must not be cached
    location /sw.js {
        proxy_pass http://127.0.0.1:3001;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # PWA manifest
    location /manifest.webmanifest {
        alias /var/www/html/thepuppyday/public/manifest.webmanifest;
        add_header Cache-Control "no-cache";
        add_header Content-Type "application/manifest+json";
    }

    # Health check (no access log noise)
    location /api/health {
        proxy_pass http://127.0.0.1:3001;
        access_log off;
    }

    # Reverse proxy to Next.js
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Prevent browsers from caching error responses (502, 503, 504)
        proxy_intercept_errors on;
        error_page 502 503 504 /502.html;

        # Prevent browser from caching HTML/dynamic responses
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Custom error page served during deployments
    location = /502.html {
        root /var/www/html/thepuppyday/public;
        internal;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Retry-After "5" always;
    }
}
