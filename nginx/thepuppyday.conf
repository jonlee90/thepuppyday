# The Puppy Day - Nginx Configuration
# Copy to /etc/nginx/sites-available/thepuppyday.com
# Then: ln -s /etc/nginx/sites-available/thepuppyday.com /etc/nginx/sites-enabled/
# Then: certbot --nginx -d thepuppyday.com -d www.thepuppyday.com

# Upstream with keepalive + failure tolerance so brief Next.js blips
# (PM2 restart, GC pause) don't bubble up to the client as 502.
upstream nextjs {
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# Redirect www to non-www
server {
    listen 80;
    listen [::]:80;
    server_name www.thepuppyday.com;
    return 301 https://thepuppyday.com$request_uri;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name thepuppyday.com;
    return 301 https://thepuppyday.com$request_uri;
}

# HTTPS www redirect
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.thepuppyday.com;

    # SSL certs managed by Certbot
    ssl_certificate /etc/letsencrypt/live/thepuppyday.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thepuppyday.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://thepuppyday.com$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name thepuppyday.com;

    # SSL certs managed by Certbot
    ssl_certificate /etc/letsencrypt/live/thepuppyday.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thepuppyday.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Upload limit (for gallery images)
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Never let browsers cache upstream failures. nginx's built-in 502
    # page bypasses add_header in location blocks, so we route 5xx to a
    # named location that forces no-store headers on the response.
    # Auto-refresh lets the browser recover on its own once upstream is back.
    error_page 500 502 503 504 = @upstream_error;
    location @upstream_error {
        internal;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        default_type text/html;
        return 502 '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>We will be right back</title><meta http-equiv="refresh" content="3"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui,-apple-system,sans-serif;background:#F8EEE5;color:#434E54;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center;padding:1rem}h1{font-size:1.5rem;margin:0 0 .5rem}p{margin:0;opacity:.7}</style></head><body><div><h1>We will be right back</h1><p>Refreshing automatically...</p></div></body></html>';
    }

    # Next.js static assets — serve from disk, bypass Node
    location /_next/static {
        alias /var/www/html/thepuppyday/.next/static;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Public static files — serve from disk
    location /images/ {
        alias /var/www/html/thepuppyday/public/images/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /favicon.ico {
        alias /var/www/html/thepuppyday/public/favicon.ico;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    

    # Health check endpoint
    # proxy_intercept_errors off so the real upstream status is visible
    # to monitoring scripts (bypasses the error_page redirect above).
    location /api/health {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
        access_log off;
    }


    # Reverse proxy to Next.js
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Retry transient upstream failures instead of bubbling up a 502.
        # Covers the 5s PM2 restart window and brief GC pauses.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 15s;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Prevent browser from caching HTML/dynamic responses
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }
}