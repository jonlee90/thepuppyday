<!DOCTYPE html>
<html lang="en" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="x-apple-disable-message-reformatting">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="format-detection" content="telephone=no,address=no,email=no,date=no">
  <title>Puppy Day</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>
    /* Reset styles for email client compatibility */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }
    table {
      border-collapse: collapse;
      border-spacing: 0;
    }
    img {
      border: 0;
      height: auto;
      line-height: 100%;
      outline: none;
      text-decoration: none;
      -ms-interpolation-mode: bicubic;
    }

    /* Typography - Clean & Elegant Professional */
    body, td, th {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: #434E54;
    }

    h1, h2, h3 {
      font-family: Georgia, 'Times New Roman', Times, serif;
      font-weight: 600;
      margin: 0 0 16px 0;
      color: #434E54;
    }

    h1 {
      font-size: 28px;
      line-height: 1.3;
    }

    h2 {
      font-size: 22px;
      line-height: 1.3;
    }

    h3 {
      font-size: 18px;
      line-height: 1.4;
    }

    p {
      margin: 0 0 16px 0;
    }

    a {
      color: #434E54;
      text-decoration: underline;
    }

    /* Buttons - Clean & Elegant Professional style */
    .button {
      display: inline-block;
      padding: 16px 36px;
      background-color: #D4A574;
      color: #ffffff !important;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      font-size: 16px;
      text-align: center;
    }

    .button-secondary {
      display: inline-block;
      padding: 16px 36px;
      background-color: transparent;
      color: #D4A574 !important;
      text-decoration: none;
      border-radius: 50px;
      border: 2px solid #D4A574;
      font-weight: 500;
      font-size: 16px;
      text-align: center;
    }

    /* Cards - Soft shadow, warm background */
    .card {
      background-color: #ffffff;
      border-radius: 12px;
      padding: 24px;
      margin: 0 0 20px 0;
      box-shadow: 0 2px 8px rgba(67, 78, 84, 0.08);
    }

    /* Info rows for appointment details */
    .info-row {
      padding: 12px 0;
      border-bottom: 1px solid #E5E5E5;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      font-weight: 500;
      color: #434E54;
      font-size: 14px;
    }

    .info-value {
      font-weight: 600;
      color: #434E54;
      font-size: 14px;
    }

    /* Badge - Subtle, professional */
    .badge {
      display: inline-block;
      padding: 6px 12px;
      background-color: #EAE0D5;
      color: #434E54;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
    }

    /* Alert boxes */
    .alert-info {
      background-color: #EFF6FF;
      border-radius: 8px;
      padding: 16px;
      margin: 0 0 20px 0;
    }

    .alert-warning {
      background-color: #FFF4E6;
      border-left: 4px solid #FFB347;
      border-radius: 4px;
      padding: 16px;
      margin: 0 0 20px 0;
    }

    .alert-error {
      background-color: #FEF2F2;
      border-left: 4px solid #EF4444;
      border-radius: 4px;
      padding: 16px;
      margin: 0 0 20px 0;
    }

    .alert-success {
      background-color: #F0FDF4;
      border-radius: 8px;
      padding: 16px;
      margin: 0 0 20px 0;
    }

    /* Content box - Cream background */
    .content-box {
      background-color: #FFFBF7;
      border-radius: 8px;
      padding: 20px;
      margin: 0 0 20px 0;
    }

    /* Footer */
    .footer {
      padding: 24px 0;
      text-align: center;
      color: #434E54;
      font-size: 14px;
    }

    .footer a {
      color: #434E54;
      text-decoration: underline;
    }

    .footer-muted {
      color: #6B7280;
      font-size: 12px;
    }

    /* Social links */
    .social-links {
      margin: 16px 0;
    }

    .social-links a {
      display: inline-block;
      margin: 0 8px;
      color: #434E54;
      text-decoration: none;
    }

    /* Responsive design for mobile email clients */
    @media only screen and (max-width: 600px) {
      .wrapper {
        width: 100% !important;
      }

      .card {
        padding: 20px !important;
      }

      h1 {
        font-size: 24px !important;
      }

      h2 {
        font-size: 20px !important;
      }

      .button,
      .button-secondary {
        display: block !important;
        width: 100% !important;
      }

      .content-box {
        padding: 16px !important;
      }
    }
  </style>
</head>
<body style="background-color: #F8EEE5; margin: 0; padding: 0;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="center" style="padding: 40px 20px;">
        <!-- Main Container -->
        <table role="presentation" class="wrapper" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width: 600px; width: 100%;">

          <!-- Header -->
          <tr>
            <td align="center" style="background-color: #434E54; padding: 48px 24px 40px 24px; border-radius: 12px 12px 0 0;">
              <img src="{{BASE_URL}}/images/puppy_day_logo_white.png" alt="Puppy Day" width="120" height="120" style="display: block; margin: 0 auto 16px auto; width: 120px; height: 120px;">
              <h1 style="font-family: Georgia, 'Times New Roman', Times, serif; color: #F8EEE5; margin: 0 0 8px 0; font-size: 34px; font-weight: 700; letter-spacing: -0.5px;">Puppy Day</h1>
              <p style="color: #D4A574; margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase;">Professional Dog Grooming</p>
            </td>
          </tr>

          <!-- Gold Accent Strip -->
          <tr>
            <td style="padding: 0;">
              <div style="height: 4px; background-color: #D4A574; background-image: linear-gradient(to right, #D4A574, #E8C9A0, #D4A574); border-radius: 2px;"></div>
            </td>
          </tr>

          <!-- Mood Banner Placeholder -->
          {{MOOD_BANNER}}

          <!-- Spacer -->
          <tr>
            <td style="padding: 16px 0 0 0;"></td>
          </tr>

          <!-- Content Section -->
          <tr>
            <td>
              {{CONTENT}}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td class="footer">
              <!-- Gold gradient divider -->
              <div style="height: 2px; background-color: #D4A574; background-image: linear-gradient(to right, #D4A574, #E8C9A0, #D4A574); margin-bottom: 24px; margin-top: 32px;"></div>
              <p style="margin: 0 0 8px 0; color: #434E54; font-size: 14px;">
                <strong>Puppy Day</strong><br>
                14936 Leffingwell Rd, La Mirada, CA 90638<br>
                <a href="tel:+16572522903" style="color: #434E54;">(657) 252-2903</a> |
                <a href="mailto:puppyday14936@gmail.com" style="color: #434E54;">puppyday14936@gmail.com</a>
              </p>
              <p style="margin: 16px 0 0 0; color: #6B7280; font-size: 12px;">
                Monday-Saturday, 9:00 AM - 5:00 PM
              </p>
              <div class="social-links" style="margin: 16px 0;">
                <a href="https://www.instagram.com/puppyday_lm" style="color: #434E54; text-decoration: none; margin: 0 8px;">Instagram @puppyday_lm</a>
              </div>
              <p style="margin: 16px 0 0 0; color: #6B7280; font-size: 12px;">
                <a href="{{UNSUBSCRIBE_LINK}}" style="color: #6B7280;">Unsubscribe</a> from these emails
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
